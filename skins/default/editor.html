<include target="_setting.html" />
<load target="./js/editor.js" />

<!--TODO-->
<div cond="$XE_VALIDATOR_MESSAGE && $XE_VALIDATOR_ID == ''" class="message {$XE_VALIDATOR_MESSAGE_TYPE}">
	<p>{$XE_VALIDATOR_MESSAGE}</p>
</div>

<form action="./" method="post" enctype="multipart/form-data" editor_sequence="2" class="bd_wrt bd_wrt_main sticker_wrt clear">
	<input type="hidden" name="mid" value="{$mid}" />
	<input type="hidden" name="act" value="procStickerInsert" />
	<input type="hidden" name="content" value="{$sticker->content}" />
	<input type="hidden" name="sticker_srl" value="{$sticker->sticker_srl}" />
	<input type="hidden" name="price" value="0" />

	<!--// 카테고리 -->
	<div cond="$mi->use_category=='Y' && $category_list" class="sticker_field">
		<select name="category_srl" class="sticker_category">
			<option value="">{$lang->category}</option>
			<!--@foreach($category_list as $val)-->
			<option disabled="disabled"|cond="!$val->grant" value="{$val->category_srl}" selected="selected"|cond="$val->grant && $val->selected || $val->category_srl == $oDocument->get('category_srl')">
				{str_repeat("&nbsp;&nbsp;", $val->depth)} {$val->title} ({$val->document_count})
			</option>
			<!--@endforeach-->
		</select>
	</div>

	<!--// 제목 -->
	<div class="sticker_field sticker_title_field">
		<input type="text" name="title" class="sticker_title_input" id="postTitle" placeholder="스티커 제목" value="{$sticker->title}" />
	</div>

	<!--// 스티커 업로드 -->
	<div class="sticker_section">
		<h3 class="sticker_section_title">스티커 업로드</h3>
		<div id="stickerUploadZone" class="sticker_upload_zone">
			<div id="stickerGrid" class="sticker_grid">
				<!--// 미리보기 타일은 JS가 동적으로 삽입 -->
				<div id="stickerPlaceholder" class="sticker_placeholder">
					<span class="sticker_placeholder_text">이미지를 드래그하거나 클릭하여 업로드</span>
					<span class="sticker_counter">
						현재 <span id="stickerCurrentCount">0</span>{$lang->stkr_uploaded_count_suffix}
						/
						{$lang->cmd_max} {$config->maxUploads}{$lang->stkr_uploaded_count_suffix}
					</span>
				</div>
			</div>
		</div>
		<input type="file" id="hiddenMultiFileInput" multiple accept="image/*" style="display:none" />
		<div id="dynamicFileInputs" style="display:none"></div>
	</div>

	<!--// 스티커 설명 (에디터) -->
	<div class="sticker_section">
		<h3 class="sticker_section_title">스티커 설명</h3>
		<div class="get_editor sticker_editor_wrap">
			{$editor}
		</div>
	</div>

	<!--// 태그 -->
	<div class="sticker_field">
		<input type="text" placeholder="{$lang->stkr_tag_input_guide}" name="tags" id="tags" value="{$sticker->tag}" class="sticker_tag_input" />
	</div>

	<!--// 버튼 -->
	<div class="sticker_buttons">
		<button type="button" onclick="history.back()" class="sticker_btn sticker_btn_cancel">{$lang->cmd_back}</button>
		<input type="submit" value="{$lang->cmd_registration}" class="sticker_btn sticker_btn_submit" />
	</div>
</form>

<script>
//<![CDATA[
var stickerConfig = {};
stickerConfig.allowMIMEType = ['image/jpeg', 'image/png', 'image/gif'];
stickerConfig.maxFileSize = {$config->file_size}; // KB
stickerConfig.minPrice = {$config->minPoint};
stickerConfig.maxPrice = {$config->maxPoint};
stickerConfig.maxFiles = {$config->maxUploads};
stickerConfig.minFiles = {$config->minUploads};
stickerConfig.isEdit = <!--@if($sticker && $sticker->sticker_srl)-->true<!--@else-->false<!--@end-->;
stickerConfig.stickerSrl = <!--@if($sticker && $sticker->sticker_srl)-->{$sticker->sticker_srl}<!--@else-->0<!--@end-->;
stickerConfig.existingFiles = [];

<!--@if($sticker && !empty($sticker_file))-->
<!--@foreach($sticker_file as $image)-->
stickerConfig.existingFiles.push({
	no: parseInt('{$image->no}', 10),
	fileName: '{$image->file_name|escapejs}',
	url: '{$image->url|escapejs}'
});
<!--@endforeach-->
<!--@end-->
//]]>
</script>
